<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F6F6F3;--bg-card:#FFFFFF;--bg-hover:#F0F1EE;--bg-section:#F1F2EE;--bg-sub:#F4F5F1;
  --border:#E1E2DC;--border-lite:#EAEBE6;
  --gold:#2F6F5E;--gold-lt:#255A4C;--gold-dim:#BFDFD5;--gold-bg:#EAF5F1;
  --text:#1B1D1B;--muted:#5C5E58;--dim:#94958E;
  --green:#1D8348;--red:#C0392B;--blue:#1F6B85;--amber:#B4740E;
}
.dark-mode{
  --bg:#1A1D20;--bg-card:#22272B;--bg-hover:#282E33;--bg-section:#262B2F;--bg-sub:#262B2F;
  --border:#333A3F;--border-lite:#2C3236;
  --gold:#4FAE94;--gold-lt:#63C4A9;--gold-dim:#3A5A50;--gold-bg:#1E2C28;
  --text:#E0E6ED;--muted:#90A4AE;--dim:#697680;
  --green:#4ADE80;--red:#F87171;--blue:#5DADE2;--amber:#F5B041;
}
html,body,*{transition:background-color .2s ease,border-color .2s ease,color .2s ease}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{display:flex;min-height:100vh}
.sidebar{width:230px;min-width:230px;background:var(--bg-card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;box-shadow:1px 0 3px rgba(20,20,20,.03)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:56px;background:var(--bg-card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0;position:sticky;top:0;z-index:50}
.content{flex:1;padding:28px 24px 80px;overflow-y:auto}
.sb-logo{padding:20px 18px 14px;border-bottom:1px solid var(--border);min-height:110px;box-sizing:border-box;display:flex;flex-direction:column}
.sb-logo-eye{font-family:'Syne',sans-serif;font-size:9px;font-weight:700;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;margin-bottom:4px}
.sb-logo-name{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:var(--text);line-height:1.1}
.sb-logo-sub{font-size:10px;color:var(--dim);margin-top:2px}
.sb-section{padding:12px 18px 4px;font-size:9px;font-weight:700;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin-top:6px;border-top:1px solid var(--border-lite)}
.sb-section:first-of-type{border-top:none;margin-top:0}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 14px;margin:1px 8px;border-radius:6px;cursor:pointer;transition:all .15s;color:var(--muted);font-size:12px;font-weight:500;border:none;background:none;width:calc(100% - 16px);text-align:left;font-family:'DM Sans',sans-serif}
.sb-item:hover{background:var(--bg-hover);color:var(--text)}
.sb-item.active{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-dim)}
.sb-bottom{margin-top:auto;padding:14px 10px;border-top:1px solid var(--border)}
.tb-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--text);letter-spacing:.04em;flex:1}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;padding:6px 14px;border-radius:5px;cursor:pointer;transition:all .15s}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-gold{background:var(--gold);color:#fff;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:none;border-radius:6px;padding:9px 18px;cursor:pointer;transition:background .15s}
.btn-gold:hover{background:var(--gold-lt)}
.btn-sm{background:transparent;border:1px solid var(--border);color:var(--dim);font-family:'DM Sans',sans-serif;font-size:11px;padding:4px 10px;border-radius:4px;cursor:pointer;transition:all .15s}
.btn-sm:hover{border-color:var(--red);color:var(--red)}
.btn-sm.ok:hover{border-color:var(--green);color:var(--green)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px;margin-bottom:28px}
.kpi{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:18px 20px;position:relative;overflow:hidden;transition:border-color .2s,transform .15s;box-shadow:0 1px 3px rgba(20,20,20,.05);cursor:pointer}
.kpi:hover{border-color:var(--gold-dim);transform:translateY(-2px)}
.kpi-accent{position:absolute;top:0;left:0;right:0;height:2px}
.kpi-label{font-size:10px;font-weight:600;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.kpi-value{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi-sub{font-size:11px;color:var(--dim);margin-top:5px}
.sec-hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sec-hdr h2{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;white-space:nowrap}
.sec-line{flex:1;height:1px;background:var(--border)}
.sec-note{font-size:11px;color:var(--dim);margin:-8px 0 16px;line-height:1.6}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;margin-bottom:24px;background:var(--bg-card);box-shadow:0 1px 3px rgba(20,20,20,.04)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg-section);padding:9px 14px;text-align:left;font-size:9px;font-weight:700;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px 14px;border-bottom:1px solid var(--border-lite);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg-hover)}
.dim{color:var(--dim)}.gold{color:var(--gold)}
.form-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:22px;box-shadow:0 1px 3px rgba(20,20,20,.04)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:14px}
.fl{display:flex;flex-direction:column;gap:5px}
.fl label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fi,select.fi,textarea.fi{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:8px 11px;outline:none;transition:border-color .15s;width:100%}
.fi:focus{border-color:var(--gold)}
.fi::placeholder{color:var(--dim)}
.badge{display:inline-flex;align-items:center;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:4px;white-space:nowrap}
.b-info{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-dim)}
.b-pend{background:#FCF1DD;color:var(--amber);border:1px solid #F0D9A6}
.empty{display:flex;flex-direction:column;align-items:center;padding:50px 20px;color:var(--dim);gap:10px;text-align:center;font-size:13px}
#notif{position:fixed;top:18px;right:18px;z-index:500;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.ni{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:11px 15px;font-size:12px;display:flex;align-items:center;gap:8px;min-width:240px;pointer-events:all;animation:sli .2s ease}
.ni.ok{border-left:3px solid var(--green)}.ni.err{border-left:3px solid var(--red)}.ni.info{border-left:3px solid var(--gold)}
@keyframes sli{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
#login-screen{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center}
.card-modulo{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:26px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.card-modulo:hover{border-color:var(--gold-dim);transform:translateY(-2px);box-shadow:0 4px 14px rgba(20,20,20,.06)}
.card-modulo.disabled{opacity:.55;cursor:not-allowed}
.card-modulo.disabled:hover{transform:none;border-color:var(--border)}
.card-modulo-icon{font-size:22px;margin-bottom:4px}
.card-modulo-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:800}
.card-modulo-sub{font-size:11px;color:var(--dim);line-height:1.5}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:30px}
#sync-status{font-size:11px;color:var(--dim)}

function saveAndSync(){
  saveLocal();

function pushToFB(){
  clearTimeout(_syncTimer);
  _syncTimer=setTimeout(()=>{
    setSyncStatus('⟳ Salvando...','var(--amber)');
    _dbRef.set({entities:DATA.entities,accounts:DATA.accounts,transactions:DATA.transactions,rules:DATA.rules,personalAccounts:DATA.personalAccounts,personalTransactions:DATA.personalTransactions,personalRules:DATA.personalRules,monthlyChecklist:DATA.monthlyChecklist,properties:DATA.properties,_ts:Date.now()}).then(()=>{
      setSyncStatus('✓ Salvo','var(--green)');
      setTimeout(()=>setSyncStatus('• Online','var(--green)'),2000);
    }).catch(e=>{
      setSyncStatus('⚠ '+e.message,'var(--red)');
      notify('Erro ao salvar: '+e.message,'err');
    });
  },250);
}

// ── DEDUPE: funde empresas com o mesmo nome (evita duplicatas de cadastro manual + seed automático) ──
function dedupeEntities(){
  const groups={};
  DATA.entities.forEach(e=>{
    const key=(e.legalName||'').trim().toUpperCase();
    if(!key) return;
    (groups[key]=groups[key]||[]).push(e);
  });
  let changed=false;
  Object.values(groups).forEach(list=>{
    if(list.length>1){
      list.sort((a,b)=>(Object.values(b).filter(Boolean).length)-(Object.values(a).filter(Boolean).length));
      const keep=list[0];
      list.slice(1).forEach(r=>{
        DATA.accounts.forEach(a=>{if(a.entityId===r.id)a.entityId=keep.id;});
        DATA.transactions.forEach(t=>{if(t.entityId===r.id)t.entityId=keep.id;});
        DATA.entities=DATA.entities.filter(e=>e.id!==r.id);
      });
      changed=true;
    }
  });
  return changed;
}

// ── LOGIN ──
function doLogin(){
  const u=document.getElementById('l-user').value.trim();
  const p=document.getElementById('l-pass').value;
  const extra=CREDS_EXTRA.find(c=>c.u.toLowerCase()===u.toLowerCase() && c.p===p);
  if((u.toLowerCase()===CREDS.u.toLowerCase() && p===CREDS.p) || extra){
    const nome=extra?extra.nome:CREDS.u;
    sessionStorage.setItem('finusa_auth','1');
    sessionStorage.setItem('finusa_user',nome);
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='flex';
    document.getElementById('tb-user').textContent=nome;
    initApp();
  } else {
    document.getElementById('l-err').style.display='block';
  }
}
function doLogout(){
  sessionStorage.removeItem('finusa_auth');
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
}
document.getElementById('l-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('l-user').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

function currentMonthKey(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function monthLabelPtBr(){
  const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const d=new Date();
  return meses[d.getMonth()]+'/'+d.getFullYear();
}
function checklistItems(){
  const items=[];
  DATA.accounts.forEach(a=>{
    const ent=DATA.entities.find(e=>e.id===a.entityId);
    items.push({id:'biz-'+a.id, label:(ent?ent.legalName:'(sem empresa)')+' — '+(a.name||'(sem nome)')});
  });
  DATA.personalAccounts.forEach(a=>{
    items.push({id:'per-'+a.id, label:'Personal — '+(a.name||'(sem nome)')});
  });
  return items;
}
function toggleChecklistItem(itemId){
  const mk=currentMonthKey();
  if(!DATA.monthlyChecklist[mk]) DATA.monthlyChecklist[mk]={};
  DATA.monthlyChecklist[mk][itemId]=!DATA.monthlyChecklist[mk][itemId];
  saveAndSync();
  render();
}

// Retorna contas com vencimento nos próximos N dias (alerta de renovação — CD, investimentos, etc.)
function upcomingMaturities(days){
  const today=new Date(); today.setHours(0,0,0,0);
  return DATA.accounts.filter(a=>a.maturityDate).map(a=>{
    const mat=new Date(a.maturityDate+'T00:00:00');
    const diff=Math.round((mat-today)/86400000);
    return {account:a,daysLeft:diff};
  }).filter(x=>x.daysLeft>=0 && x.daysLeft<=days).sort((a,b)=>a.daysLeft-b.daysLeft);
}

function handlePersonalImportFile(input){

  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const sheet=wb.Sheets[wb.SheetNames[0]];

  else { DATA.personalRules.push({id:uuid(),key,category}); }

function processPersonalImportRows(rows){
  let headerIdx=-1;
  for(let i=0;i<rows.length;i++){
    const rowStr=rows[i].map(x=>(x||'').toString().toLowerCase());
    if(rowStr.some(x=>x.includes('date')) && rowStr.some(x=>x.includes('description'))){
      headerIdx=i; break;
    }
  }
  if(headerIdx===-1){notify('Não consegui localizar a tabela de transações no arquivo.','err');return;}
  const header=rows[headerIdx].map(x=>(x||'').toString().toLowerCase());
  const dateIdx=header.findIndex(x=>x.includes('date'));
  const descIdx=header.findIndex(x=>x.includes('description'));
  const amtIdx=header.findIndex(x=>x.includes('amount'));
  const balIdx=header.findIndex(x=>x.includes('bal'));

  const parsed=[];
  for(let i=headerIdx+1;i<rows.length;i++){
    const r=rows[i];
    if(!r || !r[dateIdx]) continue;
    const desc=(r[descIdx]||'').toString().trim();
    const amtRaw=(r[amtIdx]||'').toString().replace(/,/g,'').replace(/"/g,'').trim();
    const amt=parseFloat(amtRaw);
    if(desc.toLowerCase().startsWith('beginning balance')) continue;
    if(isNaN(amt) || amt===0) continue;
    parsed.push({date:(r[dateIdx]||'').toString().trim(),description:desc,amount:amt,balance:balIdx>=0?(r[balIdx]||'').toString().trim():''});
  }
  if(!parsed.length){notify('Nenhuma transação válida encontrada no arquivo.','err');return;}

  const existing=new Set(DATA.personalTransactions.filter(t=>t.accountId===PIMP.accountId).map(t=>t.accountId+'|'+t.date+'|'+t.amount+'|'+t.originalDescription));
  let novas=0,duplicadas=0;
  const toAdd=[];
  parsed.forEach(p=>{
    const key=PIMP.accountId+'|'+p.date+'|'+p.amount+'|'+p.description;
    if(existing.has(key)){ duplicadas++; return; }
    existing.add(key);
    const rule=findPersonalRule(p.description);
    const distGuess=!rule?detectPersonalDistributionFromBusiness(p.description):null;
    const payrollGuess=(!rule && !distGuess)?detectOutsideLoungePayroll(p.description):null;
    const chaseGuess=(!rule && !distGuess && !payrollGuess)?detectChaseCreditCardPayment(p.description):null;
    const bestBuyGuess=(!rule && !distGuess && !payrollGuess && !chaseGuess)?detectBestBuyCreditCardPayment(p.description):null;
    const ohMyBossGuess=(!rule && !distGuess && !payrollGuess && !chaseGuess && !bestBuyGuess)?detectOhMyBossPetGrooming(p.description):null;
    const rokkasGuess=(!rule && !distGuess && !payrollGuess && !chaseGuess && !bestBuyGuess && !ohMyBossGuess)?detectRokkasMarket(p.description):null;
    const publixGuess=(!rule && !distGuess && !payrollGuess && !chaseGuess && !bestBuyGuess && !ohMyBossGuess && !rokkasGuess)?detectPublix(p.description):null;
    const manoloGuess=(!rule && !distGuess && !payrollGuess && !chaseGuess && !bestBuyGuess && !ohMyBossGuess && !rokkasGuess && !publixGuess)?detectBotecoDoManolo(p.description):null;
    const samsGuess=(!rule && !distGuess && !payrollGuess && !chaseGuess && !bestBuyGuess && !ohMyBossGuess && !rokkasGuess && !publixGuess && !manoloGuess)?detectSamsClubAnnualFee(p.description):null;
    const costcoGuess=(!rule && !distGuess && !payrollGuess && !chaseGuess && !bestBuyGuess && !ohMyBossGuess && !rokkasGuess && !publixGuess && !manoloGuess && !samsGuess)?detectCostco(p.description):null;
    const pGuess=distGuess||payrollGuess||chaseGuess||bestBuyGuess||ohMyBossGuess||rokkasGuess||publixGuess||manoloGuess||samsGuess||costcoGuess;
    toAdd.push({
      id:uuid(), accountId:PIMP.accountId, date:p.date,
      originalDescription:p.description, userDescription:rule?'':(pGuess?pGuess.userDescription:''),
      amount:p.amount, balance:p.balance,
      category:rule?rule.category:(pGuess?pGuess.category:''),
      status:(rule||pGuess)?'AI_SUGGESTED':'UNREVIEWED'
    });
    novas++;
  });
  DATA.personalTransactions=DATA.personalTransactions.concat(toAdd);
  saveAndSync();
  document.getElementById('pimp-result').innerHTML=`
    <div class="badge b-info">✓ ${novas} nova(s) transação(ões) importada(s)</div>
    ${duplicadas?`<div class="badge b-pend" style="margin-left:8px">${duplicadas} duplicata(s) ignorada(s)</div>`:''}
    <div style="margin-top:10px"><button class="btn-gold" onclick="goTab('preview')">Ir para Quick Review →</button></div>
  `;
  notify(`${novas} transações importadas`,'ok');
}

let PEDIT_TX_ID=null;
let PLEDGER_SEARCH='';
let PLEDGER_FILTER_ACCOUNT='';
let PLEDGER_FILTER_STATUS='';
function openPEditTx(id){ PEDIT_TX_ID=id; render(); }
function cancelPEditTx(){ PEDIT_TX_ID=null; render(); }
function savePEditTx(id){
  const t=DATA.personalTransactions.find(t=>t.id===id);
  if(!t) return;
  t.category=document.getElementById('pedit-cat-'+id).value;
  t.userDescription=document.getElementById('pedit-note-'+id).value;
  if(t.category==='Business Related > CPA Review'){
    t.status='CPA_REVIEW';

  }
  saveAndSync();
  PEDIT_TX_ID=null;
  notify('Transação atualizada','ok');
  render();
}
let pLedgerSearchDebounce=null;
function handlePLedgerSearch(val){
  PLEDGER_SEARCH=val;
  clearTimeout(pLedgerSearchDebounce);
  pLedgerSearchDebounce=setTimeout(()=>{
    const activeEl=document.activeElement;
    const cursorPos=(activeEl && activeEl.id==='pledger-search')?activeEl.selectionStart:null;
    render();
    const newEl=document.getElementById('pledger-search');
    if(newEl){ newEl.focus(); if(cursorPos!==null) newEl.setSelectionRange(cursorPos,cursorPos); }
  },200);
}
function renderPersonalLedger(c){
  if(!DATA.personalTransactions.length){
    c.innerHTML=`<div class="empty"><div style="font-size:28px">📒</div><div>Nenhuma transação pessoal importada ainda.</div></div>`;
    return;
  }
  let filtered=DATA.personalTransactions;
  if(PLEDGER_FILTER_ACCOUNT){
    filtered=filtered.filter(t=>t.accountId===PLEDGER_FILTER_ACCOUNT);
  }
  if(PLEDGER_FILTER_STATUS){
    filtered=filtered.filter(t=>t.status===PLEDGER_FILTER_STATUS);
  }
  if(PLEDGER_SEARCH.trim()){
    const q=PLEDGER_SEARCH.trim().toLowerCase();
    filtered=filtered.filter(t=>{
      const acc=DATA.personalAccounts.find(a=>a.id===t.accountId);
      const haystack=[t.originalDescription,t.userDescription,t.category,t.date,String(t.amount),acc?acc.name:''].join(' ').toLowerCase();
      return haystack.includes(q);
    });
  }
  const sorted=[...filtered].sort((a,b)=>new Date(b.date)-new Date(a.date));

  let editBox='';
  if(PEDIT_TX_ID){
    const t=DATA.personalTransactions.find(t=>t.id===PEDIT_TX_ID);
    if(t){
      const acc=DATA.personalAccounts.find(a=>a.id===t.accountId);
      editBox=`
        <div class="form-card" style="border-color:var(--gold)">
          <div style="font-size:11px;color:var(--dim);margin-bottom:4px">Editando · ${esc(acc?acc.name:'')} · ${esc(t.date)}</div>
          <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:800;margin-bottom:6px;color:${t.amount>0?'var(--green)':'var(--red)'}">${t.amount>0?'+':''}$${Math.abs(t.amount).toLocaleString('en-US',{minimumFractionDigits:2})}</div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:12px">${esc(t.originalDescription)}</div>
          <div class="fl"><label>Categoria</label>
            <select class="fi" id="pedit-cat-${t.id}">
              ${PERSONAL_CATEGORIES.map(cat=>`<option value="${cat}" ${t.category===cat?'selected':''}>${cat}</option>`).join('')}
            </select>
          </div>
          <div class="fl" style="margin-top:10px"><label>Observação (nota)</label><input class="fi" id="pedit-note-${t.id}" value="${esc(t.userDescription)}"></div>
          <div style="margin-top:12px">
            <button class="btn-gold" onclick="savePEditTx('${t.id}')">Salvar</button>
            <button class="btn-ghost" style="margin-left:8px" onclick="cancelPEditTx()">Cancelar</button>
          </div>
        </div>
      `;
    }
  }
  const rows=sorted.map(t=>{
    const acc=DATA.personalAccounts.find(a=>a.id===t.accountId);
    const statusBadge=t.status==='REVIEWED'?'<span class="badge b-info">Reviewed</span>':t.status==='AI_SUGGESTED'?'<span class="badge b-pend">AI Suggested</span>':t.status==='CPA_REVIEW'?'<span class="badge" style="background:#FDEAEA;color:var(--red);border:1px solid #F3C6C6">CPA Review (pendente)</span>':'<span class="badge" style="background:var(--bg-section);color:var(--dim);border:1px solid var(--border)">Unreviewed</span>';
    return `<tr style="cursor:pointer" onclick="openPEditTx('${t.id}')" title="Clique para editar">
      <td>${esc(t.date)}</td>
      <td>${esc(acc?acc.name:'')}</td>
      <td style="max-width:320px;white-space:normal">${esc(t.originalDescription)}${t.userDescription?`<div style="color:var(--dim);font-size:11px;margin-top:2px">📝 ${esc(t.userDescription)}</div>`:''}</td>
      <td style="text-align:right;color:${t.amount>0?'var(--green)':'var(--red)'};font-variant-numeric:tabular-nums">${t.amount>0?'+':''}$${Math.abs(t.amount).toLocaleString('en-US',{minimumFractionDigits:2})}</td>
      <td>${esc(t.category)||'<span class="dim">—</span>'}</td>
      <td>${statusBadge}</td>
    </tr>`;
  }).join('');
  document.getElementById('content').innerHTML=`
    <div class="sec-hdr"><h2>Personal — Transações</h2><div class="sec-line"></div>
      <select class="fi" style="width:220px" onchange="PLEDGER_FILTER_ACCOUNT=this.value;render()">
        <option value="">Todas as contas (${DATA.personalTransactions.length})</option>
        ${DATA.personalAccounts.map(a=>`<option value="${a.id}" ${PLEDGER_FILTER_ACCOUNT===a.id?'selected':''}>${esc(a.name)||'(sem nome)'} (${DATA.personalTransactions.filter(t=>t.accountId===a.id).length})</option>`).join('')}
      </select>
      <select class="fi" style="width:220px;margin-left:10px" onchange="PLEDGER_FILTER_STATUS=this.value;render()">
        ${(()=>{const pbase=PLEDGER_FILTER_ACCOUNT?DATA.personalTransactions.filter(t=>t.accountId===PLEDGER_FILTER_ACCOUNT):DATA.personalTransactions;return `
        <option value="">Todos os status (${pbase.length})</option>
        <option value="REVIEWED" ${PLEDGER_FILTER_STATUS==='REVIEWED'?'selected':''}>Reviewed (${pbase.filter(t=>t.status==='REVIEWED').length})</option>
        <option value="AI_SUGGESTED" ${PLEDGER_FILTER_STATUS==='AI_SUGGESTED'?'selected':''}>AI Suggested (${pbase.filter(t=>t.status==='AI_SUGGESTED').length})</option>
        <option value="UNREVIEWED" ${PLEDGER_FILTER_STATUS==='UNREVIEWED'?'selected':''}>Unreviewed (${pbase.filter(t=>t.status==='UNREVIEWED').length})</option>
        <option value="CPA_REVIEW" ${PLEDGER_FILTER_STATUS==='CPA_REVIEW'?'selected':''}>CPA Review — pendente (${pbase.filter(t=>t.status==='CPA_REVIEW').length})</option>
        `;})()}
      </select>
    </div>
    <div class="fl" style="max-width:420px;margin-bottom:14px">
      <input class="fi" type="text" id="pledger-search" placeholder="🔎 Buscar por qualquer parte do texto" value="${esc(PLEDGER_SEARCH)}" oninput="handlePLedgerSearch(this.value)">
    </div>

    <div class="tbl-wrap">

        <thead><tr><th>Data</th><th>Conta</th><th>Descrição</th><th style="text-align:right">Valor</th><th>Categoria</th><th>Status</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function addProperty(){
  if(!DATA.entities.length){notify('Cadastre uma empresa antes de adicionar um imóvel.','err');return;}
  DATA.properties.push({id:uuid(),name:'',address:'',entityId:DATA.entities[0].id});
  saveAndSync();
  render();
}
function removeProperty(id){
  DATA.properties=DATA.properties.filter(p=>p.id!==id);
  DATA.transactions.forEach(t=>{if(t.propertyId===id) delete t.propertyId;});
  saveAndSync();
  render();
}
function updProperty(id,field,val){
  const p=DATA.properties.find(p=>p.id===id);
  if(p){p[field]=val;saveAndSync();}
  render();
}
function propertyFinancials(propId){
  const txs=DATA.transactions.filter(t=>t.propertyId===propId);
  const income=txs.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0);
  const expense=txs.filter(t=>t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0);
  return {income,expense,net:income-expense,count:txs.length};
}

// PERSONAL RESUMO — entrada vs saída, salário, aluguéis, filtros
// ══════════════════════════════════════════════════════════
function renderPersonalResumo(c){
  // Salário (Income > W-2 Salary) — todas as transações pessoais
  const salaryTxs=DATA.personalTransactions.filter(t=>t.category==='Income > W-2 Salary');
  const totalSalary=salaryTxs.reduce((s,t)=>s+t.amount,0);

  // Aluguéis recebidos — soma de receita (Rental Income) de todos os imóveis cadastrados
  const totalRental=DATA.properties.reduce((s,p)=>s+propertyFinancials(p.id).income,0);

  // Despesas pessoais (tudo que é negativo na conta pessoal, exceto Transfer — pra não contar pagamento de fatura)
  const personalExpenseTxs=DATA.personalTransactions.filter(t=>t.amount<0 && t.category!=='Financial > Transfer');
  const totalPersonalExpense=personalExpenseTxs.reduce((s,t)=>s+Math.abs(t.amount),0);

  // Entrada total pessoal (tudo positivo na conta pessoal)
  const personalIncomeTxs=DATA.personalTransactions.filter(t=>t.amount>0);
  const totalPersonalIncome=personalIncomeTxs.reduce((s,t)=>s+t.amount,0);

  const net=totalPersonalIncome-totalPersonalExpense;

  document.getElementById('content').innerHTML=`
    <div class="sec-hdr"><h2>Resumo Pessoal</h2><div class="sec-line"></div></div>
    <div class="sec-note">Resumo geral de entradas e saídas. Clique em qualquer card para ver as transações relacionadas.</div>
    <div class="kpi-grid">
      <div class="kpi" onclick="goTab('pledger')"><div class="kpi-accent" style="background:var(--green)"></div><div class="kpi-label">Total Entradas (Conta Pessoal)</div><div class="kpi-value" style="color:var(--green)">+$${totalPersonalIncome.toLocaleString('en-US',{minimumFractionDigits:2})}</div><div class="kpi-sub">${personalIncomeTxs.length} transação(ões)</div></div>
      <div class="kpi" onclick="goTab('pledger')"><div class="kpi-accent" style="background:var(--red)"></div><div class="kpi-label">Total Saídas (Conta Pessoal)</div><div class="kpi-value" style="color:var(--red)">-$${totalPersonalExpense.toLocaleString('en-US',{minimumFractionDigits:2})}</div><div class="kpi-sub">${personalExpenseTxs.length} transação(ões) · exclui pagamento de fatura</div></div>
      <div class="kpi"><div class="kpi-accent" style="background:${net>=0?'var(--green)':'var(--red)'}"></div><div class="kpi-label">Saldo (Entrada − Saída)</div><div class="kpi-value" style="color:${net>=0?'var(--green)':'var(--red)'}">${net>=0?'+':'-'}$${Math.abs(net).toLocaleString('en-US',{minimumFractionDigits:2})}</div><div class="kpi-sub">${net>=0?'Ganhando mais do que gasta':'Gastando mais do que ganha'}</div></div>
    </div>

    <div class="sec-hdr"><h2>Por Fonte</h2><div class="sec-line"></div></div>
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-accent" style="background:var(--blue)"></div><div class="kpi-label">Salário Total (até hoje)</div><div class="kpi-value">$${totalSalary.toLocaleString('en-US',{minimumFractionDigits:2})}</div><div class="kpi-sub">${salaryTxs.length} pagamento(s) — Outside Lounge</div></div>
      <div class="kpi" onclick="goTab('properties')"><div class="kpi-accent" style="background:var(--gold)"></div><div class="kpi-label">Aluguéis Recebidos (todos imóveis)</div><div class="kpi-value">$${totalRental.toLocaleString('en-US',{minimumFractionDigits:2})}</div><div class="kpi-sub">${DATA.properties.length} imóvel(is) cadastrado(s)</div></div>
    </div>
  `;
}

// ── NORMALIZAÇÃO DE MERCHANT — para aprendizado de regras ──
function normalizeMerchant(desc){
  return (desc||'')
    .toUpperCase()
    .replace(/CONF(IRMATION)?#\s*\S+/g,'')
    .replace(/TRN:\S+/g,'')
    .replace(/SEQ:\S+/g,'')
    .replace(/ID:\S+/g,'')
    .replace(/DATE:\s*\d+/g,'')
    .replace(/TIME:\S+/g,'')
    .replace(/[0-9]/g,'')
    .replace(/\s+/g,' ')
    .trim()
    .slice(0,50);
}

function findRule(entityId,desc){
  const key=normalizeMerchant(desc);
  return DATA.rules.find(r=>r.entityId===entityId && key.includes(r.key));
}
function learnRule(entityId,desc,category,cpaCategory){
  const key=normalizeMerchant(desc);
  if(!key) return;
  let r=DATA.rules.find(r=>r.entityId===entityId && r.key===key);
  if(r){ r.category=category; r.cpaCategory=cpaCategory; }
  else { DATA.rules.push({id:uuid(),entityId,key,category,cpaCategory:cpaCategory||''}); }
}

      <div id="imp-result" style="margin-top:14px"></div>
    </div>
  `;

function handleImportFile(input){
  const file=input.files[0];
  if(!file || !IMP.accountId){notify('Selecione uma conta antes de importar.','err');return;}
  IMP.fileName=file.name;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(sheet,{header:1,raw:false,defval:''});
      processImportRows(rows);
    }catch(err){
      notify('Erro ao ler arquivo: '+err.message,'err');
    }
  };
  reader.readAsBinaryString(file);
}

function processImportRows(rows){
  // localizar a linha de cabeçalho real: procura por uma linha que contenha "Date" e "Description"
  let headerIdx=-1;
  for(let i=0;i<rows.length;i++){
    const rowStr=rows[i].map(x=>(x||'').toString().toLowerCase());
    if(rowStr.some(x=>x.includes('date')) && rowStr.some(x=>x.includes('description'))){
      headerIdx=i; break;
    }
  }
  if(headerIdx===-1){notify('Não consegui localizar a tabela de transações no arquivo.','err');return;}

  const header=rows[headerIdx].map(x=>(x||'').toString().toLowerCase());
  const dateIdx=header.findIndex(x=>x.includes('date'));
  const descIdx=header.findIndex(x=>x.includes('description'));
  const amtIdx=header.findIndex(x=>x.includes('amount'));
  const balIdx=header.findIndex(x=>x.includes('bal'));

  const parsed=[];
  for(let i=headerIdx+1;i<rows.length;i++){
    const r=rows[i];
    if(!r || !r[dateIdx]) continue;
    const desc=(r[descIdx]||'').toString().trim();
    const amtRaw=(r[amtIdx]||'').toString().replace(/,/g,'').replace(/"/g,'').trim();
    const amt=parseFloat(amtRaw);
    if(desc.toLowerCase().startsWith('beginning balance')) continue; // não é transação
    if(isNaN(amt) || amt===0) continue; // ignora linhas sem valor (ex: fee waiver $0.00)
    parsed.push({
      date:(r[dateIdx]||'').toString().trim(),
      description:desc,
      amount:amt,
      balance:balIdx>=0?(r[balIdx]||'').toString().trim():''
    });
  }

  if(!parsed.length){notify('Nenhuma transação válida encontrada no arquivo.','err');return;}

  // Detectar duplicatas (mesma conta + data + valor + descrição)
  const existing=new Set(DATA.transactions.filter(t=>t.accountId===IMP.accountId).map(t=>t.accountId+'|'+t.date+'|'+t.amount+'|'+t.originalDescription));
  let novas=0,duplicadas=0;
  const toAdd=[];
  parsed.forEach(p=>{
    const key=IMP.accountId+'|'+p.date+'|'+p.amount+'|'+p.description;
    if(existing.has(key)){ duplicadas++; return; }
    existing.add(key);
    const rule=findRule(IMP.entityId,p.description);
    const wireGuess=!rule?detectWireContributionFromBrazil(p.description):null;
    const distGuess=(!rule && !wireGuess)?detectMemberDistribution(p.description):null;
    const intercoGuess=(!rule && !wireGuess && !distGuess)?detectIntercompanyContribution(p.description):null;
    const propGuess=(!rule && !wireGuess && !distGuess && !intercoGuess)?detectPropertyPatterns(p.description):null;
    const secGuess=(!rule && !wireGuess && !distGuess && !intercoGuess && !propGuess)?detectSecurityFirstInsurance(p.description):null;
    const bofaGuess=(!rule && !wireGuess && !distGuess && !intercoGuess && !propGuess && !secGuess)?detectBofaMaintenanceFee(p.description,p.amount):null;
    const chkgGuess=(!rule && !wireGuess && !distGuess && !intercoGuess && !propGuess && !secGuess && !bofaGuess)?detectChkg7968InternalTransfer(p.description):null;
    const vixGuess=(!rule && !wireGuess && !distGuess && !intercoGuess && !propGuess && !secGuess && !bofaGuess && !chkgGuess)?detectVixConstructionPayment(p.description,p.amount):null;
    const marichellGuess=(!rule && !wireGuess && !distGuess && !intercoGuess && !propGuess && !secGuess && !bofaGuess && !chkgGuess && !vixGuess)?detectMarichellLandscaping(p.description):null;
    const tmobileGuess=(!rule && !wireGuess && !distGuess && !intercoGuess && !propGuess && !secGuess && !bofaGuess && !chkgGuess && !vixGuess && !marichellGuess)?detectTMobilePersonal(p.description):null;
    const spectrumGuess=(!rule && !wireGuess && !distGuess && !intercoGuess && !propGuess && !secGuess && !bofaGuess && !chkgGuess && !vixGuess && !marichellGuess && !tmobileGuess)?detectSpectrumInternet(p.description):null;
    const orangeCoGuess=(!rule && !wireGuess && !distGuess && !intercoGuess && !propGuess && !secGuess && !bofaGuess && !chkgGuess && !vixGuess && !marichellGuess && !tmobileGuess && !spectrumGuess)?detectOrangeCountyUtilities(p.description):null;
    const hoaGuess=(!rule && !wireGuess && !distGuess && !intercoGuess && !propGuess && !secGuess && !bofaGuess && !chkgGuess && !vixGuess && !marichellGuess && !tmobileGuess && !spectrumGuess && !orangeCoGuess)?detectLakesOfWindermereHOA(p.description,p.amount):null;
    const paschoalGuess=(!rule && !wireGuess && !distGuess && !intercoGuess && !propGuess && !secGuess && !bofaGuess && !chkgGuess && !vixGuess && !marichellGuess && !tmobileGuess && !spectrumGuess && !orangeCoGuess && !hoaGuess)?detectPaschoalLandscaping(p.description):null;
    const moriahGuess=(!rule && !wireGuess && !distGuess && !intercoGuess && !propGuess && !secGuess && !bofaGuess && !chkgGuess && !vixGuess && !marichellGuess && !tmobileGuess && !spectrumGuess && !orangeCoGuess && !hoaGuess && !paschoalGuess)?detectMoriahBestServices(p.description):null;
    const blessedGuess=(!rule && !wireGuess && !distGuess && !intercoGuess && !propGuess && !secGuess && !bofaGuess && !chkgGuess && !vixGuess && !marichellGuess && !tmobileGuess && !spectrumGuess && !orangeCoGuess && !hoaGuess && !paschoalGuess && !moriahGuess)?detectBlessedBrave(p.description):null;
    const decolumberGuess=(!rule && !wireGuess && !distGuess && !intercoGuess && !propGuess && !secGuess && !bofaGuess && !chkgGuess && !vixGuess && !marichellGuess && !tmobileGuess && !spectrumGuess && !orangeCoGuess && !hoaGuess && !paschoalGuess && !moriahGuess && !blessedGuess)?detectDecolumber(p.description):null;
    const lucianoGuess=(!rule && !wireGuess && !distGuess && !intercoGuess && !propGuess && !secGuess && !bofaGuess && !chkgGuess && !vixGuess && !marichellGuess && !tmobileGuess && !spectrumGuess && !orangeCoGuess && !hoaGuess && !paschoalGuess && !moriahGuess && !blessedGuess && !decolumberGuess)?detectLucianoLMagic(p.description):null;
    const ccBillGuess=(!rule && !wireGuess && !distGuess && !intercoGuess && !propGuess && !secGuess && !bofaGuess && !chkgGuess && !vixGuess && !marichellGuess && !tmobileGuess && !spectrumGuess && !orangeCoGuess && !hoaGuess && !paschoalGuess && !moriahGuess && !blessedGuess && !decolumberGuess && !lucianoGuess)?detectCreditCardBillPayment(p.description):null;
    const guess=wireGuess||distGuess||intercoGuess||propGuess||secGuess||bofaGuess||chkgGuess||vixGuess||marichellGuess||tmobileGuess||spectrumGuess||orangeCoGuess||hoaGuess||paschoalGuess||moriahGuess||blessedGuess||decolumberGuess||lucianoGuess||ccBillGuess;
    toAdd.push({
      id:uuid(),
      entityId:IMP.entityId,
      accountId:IMP.accountId,
      date:p.date,
      originalDescription:p.description,
      userDescription:rule?'':(guess?guess.userDescription:''),
      amount:p.amount,
      balance:p.balance,
      category:rule?rule.category:(guess?guess.category:''),
      cpaCategory:rule?rule.cpaCategory:(guess?guess.cpaCategory:''),
      status:(rule||guess)?'AI_SUGGESTED':'UNREVIEWED'
    });
    novas++;
  });

  DATA.transactions=DATA.transactions.concat(toAdd);
  saveAndSync();

  document.getElementById('imp-result').innerHTML=`
    <div class="badge b-info">✓ ${novas} nova(s) transação(ões) importada(s)</div>
    ${duplicadas?`<div class="badge b-pend" style="margin-left:8px">${duplicadas} duplicata(s) ignorada(s)</div>`:''}
    <div style="margin-top:10px"><button class="btn-gold" onclick="goTab('review')">Ir para Quick Review →</button></div>
  `;
  notify(`${novas} transações importadas`,'ok');
}

// ── QUICK REVIEW ──
function pendingQueue(){
  return DATA.transactions
    .filter(t=>t.status==='UNREVIEWED'||t.status==='AI_SUGGESTED')
    .sort((a,b)=>(a.status==='AI_SUGGESTED'?0:1)-(b.status==='AI_SUGGESTED'?0:1));
}
function cpaReviewQueue(){
  return DATA.transactions.filter(t=>t.status==='CPA_REVIEW');
}
function needsAttentionCount(){
  return pendingQueue().length + cpaReviewQueue().length;
}

function renderReview(c){
  const queue=pendingQueue();
  if(!queue.length){
    const cpaQ=cpaReviewQueue();
    c.innerHTML=cpaQ.length ? `
      <div class="empty">
        <div style="font-size:28px">✅</div>
        <div>Fila de classificação zerada!</div>
        <div style="margin-top:10px;font-size:12px">Mas ainda há <b>${cpaQ.length} transação(ões)</b> marcada(s) como <b>CPA Review</b>, aguardando o contador decidir. Elas não bloqueiam seu fluxo, mas seguem pendentes.</div>
        <button class="btn-gold" style="margin-top:14px" onclick="goTab('ledger')">Ver em Transações →</button>
      </div>
    ` : `<div class="empty"><div style="font-size:28px">✅</div><div>Tudo revisado! Nenhuma transação pendente.</div></div>`;
    return;
  }
  const t=queue[0];
  const ent=DATA.entities.find(e=>e.id===t.entityId);
  const acc=DATA.accounts.find(a=>a.id===t.accountId);
  const isCredit=t.amount>0;

  c.innerHTML=`
    <div class="sec-hdr"><h2>Quick Review</h2><div class="sec-line"></div><div style="font-size:11px;color:var(--dim)">${queue.length} pendente(s)</div></div>
    <div class="form-card" style="max-width:620px">
      <div style="font-size:11px;color:var(--dim);margin-bottom:4px">${esc(ent?ent.legalName:'')} · ${esc(acc?acc.name:'')} · ${esc(t.date)}</div>
      <div style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:${isCredit?'var(--green)':'var(--red)'};margin-bottom:6px">${isCredit?'+':''}$${Math.abs(t.amount).toLocaleString('en-US',{minimumFractionDigits:2})}</div>
      <div style="font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:14px;padding:10px;background:var(--bg-section);border-radius:6px">${esc(t.originalDescription)}</div>

      ${t.status==='AI_SUGGESTED' ? `
        <div style="background:var(--gold-bg);border:1px solid var(--gold-dim);border-radius:8px;padding:12px;margin-bottom:14px">
          <div style="font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;margin-bottom:4px">Suggested Category (aprendido)</div>
          <div style="font-weight:700;margin-bottom:4px">${esc(t.category)}${t.cpaCategory?' · '+esc(t.cpaCategory):''}</div>
          ${t.userDescription?`<div style="font-size:12px;color:var(--muted);margin-bottom:8px">📝 ${esc(t.userDescription)}</div>`:''}
          <button class="btn-gold" onclick="approveReview('${t.id}')">✓ Approve</button>
          <button class="btn-ghost" style="margin-left:8px" onclick="clearSuggestion('${t.id}')">Change</button>
        </div>
      ` : `
        <div class="fl" style="margin-bottom:10px">
          <label>What was this? (User Category)</label>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">
            ${CAT_QUICK.map(cat=>`<button class="btn-sm ok" style="padding:6px 12px" onclick="selectQuickCat('${t.id}','${cat}')">${cat}</button>`).join('')}
          </div>
          <select class="fi" id="rev-cat-${t.id}">
            <option value="">Outra categoria...</option>
            ${CAT_BUSINESS.map(cat=>`<option value="${cat}">${cat}</option>`).join('')}
          </select>
        </div>
        <div class="fg" style="grid-template-columns:1fr 1fr">
          <div class="fl"><label>CPA / Accounting Category</label><input class="fi" id="rev-cpa-${t.id}" placeholder="Ex: Member Equity - Contribution"></div>
          <div class="fl"><label>User Description (nota)</label><input class="fi" id="rev-note-${t.id}" placeholder="Observação livre"></div>
        </div>
        <button class="btn-gold" style="margin-top:12px" onclick="saveReviewFull('${t.id}')">SAVE & NEXT</button>
      `}
    </div>
  `;
}

function selectQuickCat(id,cat){
  const t=DATA.transactions.find(t=>t.id===id);
  if(!t)return;
  t.category=cat;
  t.cpaCategory=document.getElementById('rev-cpa-'+id)?document.getElementById('rev-cpa-'+id).value:'';
  t.userDescription=document.getElementById('rev-note-'+id)?document.getElementById('rev-note-'+id).value:'';
  if(cat==='CPA Review'){
    t.status='CPA_REVIEW'; // não conta como revisado — fica pendente até o contador decidir
  } else {
    t.status='REVIEWED';
    learnRule(t.entityId,t.originalDescription,t.category,t.cpaCategory);
  }
  saveAndSync();
  render();
}
function saveReviewFull(id){
  const t=DATA.transactions.find(t=>t.id===id);
  if(!t)return;
  const cat=document.getElementById('rev-cat-'+id).value;
  if(!cat){notify('Selecione uma categoria.','err');return;}
  t.category=cat;
  t.cpaCategory=document.getElementById('rev-cpa-'+id).value;
  t.userDescription=document.getElementById('rev-note-'+id).value;
  if(cat==='CPA Review'){
    t.status='CPA_REVIEW';
  } else {
    t.status='REVIEWED';
    learnRule(t.entityId,t.originalDescription,t.category,t.cpaCategory);
  }
  saveAndSync();
  render();
}
function approveReview(id){
  const t=DATA.transactions.find(t=>t.id===id);
  if(!t)return;
  t.status='REVIEWED';
  learnRule(t.entityId,t.originalDescription,t.category,t.cpaCategory);
  saveAndSync();
  render();
}
function clearSuggestion(id){
  const t=DATA.transactions.find(t=>t.id===id);
  if(!t)return;
  t.status='UNREVIEWED';
  render();
}

// ── LEDGER (todas as transações) — com edição inline e filtro por empresa ──
let EDIT_TX_ID=null;
let LEDGER_FILTER_ENTITY='';
let LEDGER_FILTER_STATUS='';
let LEDGER_SEARCH='';
function openEditTx(id){ EDIT_TX_ID=id; render(); }
function cancelEditTx(){ EDIT_TX_ID=null; render(); }
function saveEditTx(id){
  const t=DATA.transactions.find(t=>t.id===id);
  if(!t) return;
  t.category=document.getElementById('edit-cat-'+id).value;
  t.cpaCategory=document.getElementById('edit-cpa-'+id).value;
  t.userDescription=document.getElementById('edit-note-'+id).value;
  const propEl=document.getElementById('edit-prop-'+id);
  if(propEl){ t.propertyId=propEl.value||undefined; }
  if(t.category==='CPA Review'){
    t.status='CPA_REVIEW';
  } else {
    t.status='REVIEWED';
    learnRule(t.entityId,t.originalDescription,t.category,t.cpaCategory);
  }
  saveAndSync();
  EDIT_TX_ID=null;
  notify('Transação atualizada','ok');
  render();
}

let ledgerSearchDebounce=null;
function handleLedgerSearch(val){
  LEDGER_SEARCH=val;
  clearTimeout(ledgerSearchDebounce);
  ledgerSearchDebounce=setTimeout(()=>{
    const activeEl=document.activeElement;
    const cursorPos=(activeEl && activeEl.id==='ledger-search')?activeEl.selectionStart:null;
    render();
    const newEl=document.getElementById('ledger-search');
    if(newEl){
      newEl.focus();
      if(cursorPos!==null) newEl.setSelectionRange(cursorPos,cursorPos);
    }
  },200);
}

function renderLedger(c){
  if(!DATA.transactions.length){
    c.innerHTML=`<div class="empty"><div style="font-size:28px">📒</div><div>Nenhuma transação importada ainda.</div></div>`;
    return;
  }
  let filtered=LEDGER_FILTER_ENTITY?DATA.transactions.filter(t=>t.entityId===LEDGER_FILTER_ENTITY):DATA.transactions;
  if(LEDGER_FILTER_STATUS){
    filtered=filtered.filter(t=>t.status===LEDGER_FILTER_STATUS);
  }
  if(LEDGER_SEARCH.trim()){
    const q=LEDGER_SEARCH.trim().toLowerCase();
    filtered=filtered.filter(t=>{
      const ent=DATA.entities.find(e=>e.id===t.entityId);
      const acc=DATA.accounts.find(a=>a.id===t.accountId);
      const haystack=[
        t.originalDescription,t.userDescription,t.category,t.cpaCategory,
        t.date,String(t.amount),ent?ent.legalName:'',acc?acc.name:''
      ].join(' ').toLowerCase();
      return haystack.includes(q);
    });
  }
  const sorted=[...filtered].sort((a,b)=>new Date(b.date)-new Date(a.date));

  let editBox='';
  if(EDIT_TX_ID){
    const t=DATA.transactions.find(t=>t.id===EDIT_TX_ID);
    if(t){
      const ent=DATA.entities.find(e=>e.id===t.entityId);
      editBox=`
        <div class="form-card" style="border-color:var(--gold)">
          <div style="font-size:11px;color:var(--dim);margin-bottom:4px">Editando transação · ${esc(ent?ent.legalName:'')} · ${esc(t.date)}</div>
          <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:800;margin-bottom:6px;color:${t.amount>0?'var(--green)':'var(--red)'}">${t.amount>0?'+':''}$${Math.abs(t.amount).toLocaleString('en-US',{minimumFractionDigits:2})}</div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:12px">${esc(t.originalDescription)}</div>
          <div class="fg" style="grid-template-columns:1fr 1fr">
            <div class="fl"><label>User Category</label>
              <select class="fi" id="edit-cat-${t.id}">
                ${CAT_BUSINESS.map(cat=>`<option value="${cat}" ${t.category===cat?'selected':''}>${cat}</option>`).join('')}
              </select>
            </div>
            <div class="fl"><label>CPA / Accounting Category</label><input class="fi" id="edit-cpa-${t.id}" value="${esc(t.cpaCategory)}"></div>
          </div>
          <div class="fl" style="margin-top:10px"><label>User Description (nota)</label><input class="fi" id="edit-note-${t.id}" value="${esc(t.userDescription)}"></div>
          ${DATA.properties.some(p=>p.entityId===t.entityId) ? `
          <div class="fl" style="margin-top:10px"><label>Imóvel (opcional)</label>
            <select class="fi" id="edit-prop-${t.id}">
              <option value="">Nenhum</option>
              ${DATA.properties.filter(p=>p.entityId===t.entityId).map(p=>`<option value="${p.id}" ${t.propertyId===p.id?'selected':''}>${esc(p.name)||'(sem nome)'}</option>`).join('')}
            </select>
          </div>` : ''}
          <div style="margin-top:12px">
            <button class="btn-gold" onclick="saveEditTx('${t.id}')">Salvar</button>
            <button class="btn-ghost" style="margin-left:8px" onclick="cancelEditTx()">Cancelar</button>
          </div>
        </div>
      `;
    }
  }

  const rows=sorted.map(t=>{
    const ent=DATA.entities.find(e=>e.id===t.entityId);
    const acc=DATA.accounts.find(a=>a.id===t.accountId);
    const statusBadge=t.status==='REVIEWED'?'<span class="badge b-info">Reviewed</span>':t.status==='AI_SUGGESTED'?'<span class="badge b-pend">AI Suggested</span>':t.status==='CPA_REVIEW'?'<span class="badge" style="background:#FDEAEA;color:var(--red);border:1px solid #F3C6C6">CPA Review (pendente)</span>':'<span class="badge" style="background:var(--bg-section);color:var(--dim);border:1px solid var(--border)">Unreviewed</span>';
    return `<tr style="cursor:pointer" onclick="openEditTx('${t.id}')" title="Clique para editar">
      <td>${esc(t.date)}</td>
      <td>${esc(ent?ent.legalName:'')}</td>
      <td>${esc(acc?acc.name:'')}</td>
      <td style="max-width:280px;white-space:normal">${esc(t.originalDescription)}${t.userDescription?`<div style="color:var(--dim);font-size:11px;margin-top:2px">📝 ${esc(t.userDescription)}</div>`:''}</td>
      <td style="text-align:right;color:${t.amount>0?'var(--green)':'var(--red)'};font-variant-numeric:tabular-nums">${t.amount>0?'+':''}$${Math.abs(t.amount).toLocaleString('en-US',{minimumFractionDigits:2})}</td>
      <td>${esc(t.category)||'<span class="dim">—</span>'}</td>
      <td>${esc(t.cpaCategory)||'<span class="dim">—</span>'}</td>
      <td>${statusBadge}</td>
    </tr>`;
  }).join('');

  document.getElementById('content').innerHTML=`
    <div class="sec-hdr"><h2>Transações</h2><div class="sec-line"></div>
      <select class="fi" style="width:260px" onchange="LEDGER_FILTER_ENTITY=this.value;render()">
        <option value="">Todas as empresas (${DATA.transactions.length})</option>
        ${DATA.entities.map(e=>`<option value="${e.id}" ${LEDGER_FILTER_ENTITY===e.id?'selected':''}>${esc(e.legalName)||'(sem nome)'} (${DATA.transactions.filter(t=>t.entityId===e.id).length})</option>`).join('')}
      </select>
      <select class="fi" style="width:220px;margin-left:10px" onchange="LEDGER_FILTER_STATUS=this.value;render()">
        ${(()=>{const base=LEDGER_FILTER_ENTITY?DATA.transactions.filter(t=>t.entityId===LEDGER_FILTER_ENTITY):DATA.transactions;return `
        <option value="">Todos os status (${base.length})</option>
        <option value="REVIEWED" ${LEDGER_FILTER_STATUS==='REVIEWED'?'selected':''}>Reviewed (${base.filter(t=>t.status==='REVIEWED').length})</option>
        <option value="AI_SUGGESTED" ${LEDGER_FILTER_STATUS==='AI_SUGGESTED'?'selected':''}>AI Suggested (${base.filter(t=>t.status==='AI_SUGGESTED').length})</option>
        <option value="UNREVIEWED" ${LEDGER_FILTER_STATUS==='UNREVIEWED'?'selected':''}>Unreviewed (${base.filter(t=>t.status==='UNREVIEWED').length})</option>
        <option value="CPA_REVIEW" ${LEDGER_FILTER_STATUS==='CPA_REVIEW'?'selected':''}>CPA Review — pendente (${base.filter(t=>t.status==='CPA_REVIEW').length})</option>
        `;})()}
      </select>
    </div>
    <div class="fl" style="max-width:420px;margin-bottom:14px">
      <input class="fi" type="text" id="ledger-search" placeholder="🔎 Buscar por qualquer parte do texto (descrição, categoria, empresa, valor...)" value="${esc(LEDGER_SEARCH)}" oninput="handleLedgerSearch(this.value)">
    </div>
    <div style="font-size:11px;color:var(--dim);margin:-8px 0 14px">${filtered.length} transação(ões)${LEDGER_SEARCH.trim()?` encontrada(s) para "${esc(LEDGER_SEARCH.trim())}"`:''} · clique em uma linha para editar</div>
    ${editBox}
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Data</th><th>Empresa</th><th>Conta</th><th>Descrição</th><th style="text-align:right">Valor</th><th>Categoria</th><th>CPA Category</th><th>Status</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

// ── BOOT ──
if(sessionStorage.getItem('finusa_auth')==='1'){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('tb-user').textContent=sessionStorage.getItem('finusa_user')||'';
  initApp();
} else {
  document.getElementById('login-screen').style.display='flex';
}
goTab('home');
</script>
